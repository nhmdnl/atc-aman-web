<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="540" height="120">
  <defs>
    <radialGradient id="logoSweep" cx="60" cy="60" r="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
    <filter id="logoGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Icon Section (Left) -->
  <g transform="translate(10, 10)">
    <!-- Scope Circles -->
    <circle cx="50" cy="50" r="48" fill="#0a0f1e" stroke="#00ff88" stroke-width="2" stroke-opacity="0.8"/>
    <circle cx="50" cy="50" r="34" fill="none" stroke="#00ff88" stroke-width="1.2" stroke-opacity="0.3"/>
    <circle cx="50" cy="50" r="18" fill="none" stroke="#00ff88" stroke-width="1.2" stroke-opacity="0.3"/>
    
    <!-- Crosshairs -->
    <line x1="50" y1="6" x2="50" y2="94" stroke="#00ff88" stroke-width="1" stroke-opacity="0.25"/>
    <line x1="6" y1="50" x2="94" y2="50" stroke="#00ff88" stroke-width="1" stroke-opacity="0.25"/>
    
    <!-- Sweep Wedge -->
    <path d="M 50,50 L 84,16 A 48,48 0 0,0 50,2 Z" fill="url(#logoSweep)"/>
    <line x1="50" y1="50" x2="84" y2="16" stroke="#00ff88" stroke-width="2" filter="url(#logoGlow)"/>

    <!-- Blip -->
    <circle cx="72" cy="28" r="2.5" fill="#00ff88" filter="url(#logoGlow)"/>
    
    <!-- Center Dot -->
    <circle cx="50" cy="50" r="4" fill="#00ff88"/>
  </g>

  <!-- Typography (Right) -->
  <text x="135" y="66" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="2">
    ATC <tspan fill="#00ff88" filter="url(#logoGlow)">AMAN</tspan>
  </text>
  <text x="136" y="94" fill="#94a3b8" font-family="monospace" font-size="14" font-weight="500" letter-spacing="3">
    HHAS AIR TRAFFIC CONTROL
  </text>
</svg>