<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#0e172e"/>
      <stop offset="60%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#050811"/>
    </radialGradient>

    <!-- Radar Sweep Conic/Radial Simulation -->
    <radialGradient id="sweepGlow" cx="256" cy="256" r="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#00ff88" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="sweepBeam" x1="256" y1="256" x2="430" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="16" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Dark App Icon Shape -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#00ff88" stroke-opacity="0.25" stroke-width="3"/>

  <!-- Radar Scope Outer Ring -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="#00ff88" stroke-opacity="0.2" stroke-width="2"/>
  
  <!-- Concentric Range Rings -->
  <circle cx="256" cy="256" r="165" fill="none" stroke="#00ff88" stroke-opacity="0.15" stroke-width="1.5"/>
  <circle cx="256" cy="256" r="115" fill="none" stroke="#00ff88" stroke-opacity="0.15" stroke-width="1.5"/>
  <circle cx="256" cy="256" r="65" fill="none" stroke="#00ff88" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- Crosshairs -->
  <line x1="256" y1="45" x2="256" y2="467" stroke="#00ff88" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="6,6"/>
  <line x1="45" y1="256" x2="467" y2="256" stroke="#00ff88" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="6,6"/>

  <!-- Cardinal Compass Markers -->
  <text x="256" y="70" fill="#00ff88" fill-opacity="0.6" font-family="monospace" font-size="16" font-weight="700" text-anchor="middle">N</text>
  <text x="445" y="261" fill="#00ff88" fill-opacity="0.6" font-family="monospace" font-size="16" font-weight="700" text-anchor="middle">E</text>
  <text x="256" y="452" fill="#00ff88" fill-opacity="0.6" font-family="monospace" font-size="16" font-weight="700" text-anchor="middle">S</text>
  <text x="67" y="261" fill="#00ff88" fill-opacity="0.6" font-family="monospace" font-size="16" font-weight="700" text-anchor="middle">W</text>

  <!-- Radar Sweep Sector Wedge -->
  <path d="M 256,256 L 400,105 A 215,215 0 0,0 256,41 Z" fill="url(#sweepGlow)" opacity="0.8"/>
  <line x1="256" y1="256" x2="400" y2="105" stroke="url(#sweepBeam)" stroke-width="3" filter="url(#glow)"/>

  <!-- Aircraft Blip 1: Main Arrival In Sweep -->
  <g filter="url(#strongGlow)">
    <circle cx="355" cy="150" r="4.5" fill="#00ff88"/>
    <!-- Aircraft Vector Symbol -->
    <path d="M 355,142 L 361,155 L 355,152 L 349,155 Z" fill="#00ff88" transform="rotate(45, 355, 150)"/>
    <!-- Position History Trail Dots -->
    <circle cx="340" cy="170" r="2.5" fill="#00ff88" opacity="0.6"/>
    <circle cx="328" cy="188" r="1.8" fill="#00ff88" opacity="0.3"/>
  </g>

  <!-- Aircraft Data Block -->
  <rect x="375" y="132" width="70" height="26" rx="4" fill="#0a0f1e" fill-opacity="0.85" stroke="#00ff88" stroke-opacity="0.4" stroke-width="1"/>
  <line x1="359" y1="147" x2="375" y2="142" stroke="#00ff88" stroke-opacity="0.5" stroke-width="1"/>
  <text x="382" y="145" fill="#00ff88" font-family="monospace" font-size="10" font-weight="700">AMAN01</text>
  <text x="382" y="154" fill="#38bdf8" font-family="monospace" font-size="8">080^22</text>

  <!-- Aircraft Blip 2: Approaching (Sky Blue) -->
  <circle cx="160" cy="340" r="3.5" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="172" cy="355" r="2" fill="#38bdf8" opacity="0.5"/>

  <!-- Aircraft Blip 3: Outbound/Holding (Amber) -->
  <circle cx="340" cy="330" r="3.5" fill="#f59e0b" filter="url(#glow)"/>

  <!-- Center Airport (HHAS) Beacon & Tower -->
  <g filter="url(#glow)">
    <circle cx="256" cy="256" r="12" fill="none" stroke="#00ff88" stroke-width="2"/>
    <circle cx="256" cy="256" r="5" fill="#00ff88"/>
    <!-- Runway Symbol 07/25 -->
    <line x1="230" y1="270" x2="282" y2="242" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>